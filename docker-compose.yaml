version: '3.9'

services:
  mysql:
    image: mysql:8.3
    container_name: whispr-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_DATABASE: whispr_dev
      MYSQL_USER: whispr_user
      MYSQL_PASSWORD: whispr_pass
    ports:
      - "3307:3306"  # Docker's MySQL will use port 3307 on your machine
    volumes:
      - whispr-data:/var/lib/mysql

volumes:
  whispr-data:
